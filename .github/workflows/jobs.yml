name: jobs
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    if: |
      contains(github.event.head_commit.message, 'feat:') ||
      contains(github.event.head_commit.message, 'fix:') ||
      contains(github.event.head_commit.message, 'perf:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::905418046894:role/matthewcollett-site-deploy
          aws-region: us-east-1

      - name: Download assets
        run: |
          mkdir -p src/assets
          aws s3 sync s3://matthewcollett.ca/assets/ src/assets/

      - name: Build
        run: yarn build

      - name: Deploy
        run: aws s3 sync dist/ s3://matthewcollett.ca/src/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  release:
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
